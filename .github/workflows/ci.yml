name: CI

on:
  push:
  pull_request:

jobs:
  static:
    name: Composer, PHPStan, code style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, gmp, mbstring, xml, curl, sqlite, zip
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict --no-check-publish

      - name: Validate COMPOSER_AUTH when it is configured
        env:
          COMPOSER_AUTH: ${{ secrets.COMPOSER_AUTH }}
        run: |
          if [ -n "${COMPOSER_AUTH}" ]; then
            php -r 'json_decode((string) getenv("COMPOSER_AUTH")); if (json_last_error() !== JSON_ERROR_NONE) { fwrite(STDERR, "COMPOSER_AUTH is not valid JSON\n"); exit(1); }'
            echo "COMPOSER_AUTH is valid JSON"
          else
            echo "COMPOSER_AUTH is not set. This package's dependencies are public, so install continues without it."
          fi

      - name: Install dependencies
        env:
          COMPOSER_AUTH: ${{ secrets.COMPOSER_AUTH }}
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: PHPStan
        run: composer analyse -- --no-progress

      - name: Code style
        run: composer format:check

  tests:
    name: PHPUnit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: bcmath, gmp, mbstring, xml, curl, sqlite, zip
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        env:
          COMPOSER_AUTH: ${{ secrets.COMPOSER_AUTH }}
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Test
        run: composer test
