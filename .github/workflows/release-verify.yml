name: Release verify

# Tag-triggered check for packages consumed via VCS tags.
# This workflow does not publish to Packagist and does not create tags or releases.
on:
  push:
    tags:
      - 'v*'

jobs:
  verify:
    name: Verify ${{ matrix.php }} before release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: bcmath, gmp, mbstring, xml, curl, sqlite, zip
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict --no-check-publish

      - name: Install dependencies
        env:
          COMPOSER_AUTH: ${{ secrets.COMPOSER_AUTH }}
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: PHPStan
        run: composer analyse -- --no-progress

      - name: Code style
        run: composer format:check

      - name: Test
        run: composer test
